disabled_rules:
  - trailing_whitespace
  - trailing_comma
  - opening_brace

opt_in_rules:
  - empty_count
  - force_unwrapping
  - redundant_nil_coalescing
  - explicit_init
  - sorted_imports
  - first_where

line_length:
  warning: 600
  error: 800

type_body_length:
  warning: 800
  error: 1000
  
file_length:
  warning: 900
  error: 1000

identifier_name:
  min_length: 2
  max_length: 40
  allowed_symbols:
    - "_"
